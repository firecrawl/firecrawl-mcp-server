events {}
http {
  upstream app { server 127.0.0.1:3000; }
  gzip off;

  server {
    listen 8080;

    # OAuth discovery documents (RFC 8414 / RFC 9728) must reach the app with the
    # URI intact. `^~` makes this prefix win over the legacy /{apiKey}/{rest} regex
    # below, which would otherwise treat ".well-known" as an API key and rewrite the
    # path to /oauth-protected-resource (404). This is what the 401 challenge's
    # `resource_metadata` URL points at, so it MUST resolve.
    location ^~ /.well-known/ {
      proxy_buffering off;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app;
    }


    # Account/OAuth hosted Streamable HTTP MCP endpoint. This MUST come before
    # the generic /v1|v2 rewrite below; otherwise /v2/mcp-oauth is rewritten to
    # /mcp-oauth and the account connector endpoint is not deployable.
    location ~ ^/v2/mcp-oauth/?$ {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      chunked_transfer_encoding off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Overwrite any client-supplied request id at the hosted edge. The app
      # also generates its own audit id, but this keeps ingress logs unspoofed.
      proxy_set_header X-Request-ID $request_id;
      rewrite ^ /v2/mcp-oauth break;
      proxy_pass http://app;
    }

    # Anthropic marketplace hosted Streamable HTTP MCP endpoint. This profile is
    # a separate OAuth resource and must not fall through to the generic /v2
    # rewrite or the keyless /v2/mcp endpoint.
    location ~ ^/v2/mcp-search/?$ {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      chunked_transfer_encoding off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Overwrite any client-supplied request id at the hosted edge. The app
      # also generates its own audit id, but this keeps ingress logs unspoofed.
      proxy_set_header X-Request-ID $request_id;
      rewrite ^ /v2/mcp-search break;
      proxy_pass http://app;
    }

    # Keyless hosted Streamable HTTP MCP endpoint. Keep this path coherent with
    # FASTMCP_ENDPOINT=/v2/mcp in the default service image. The old /mcp path
    # is still proxied here so existing remote clients do not break.
    location ~ ^/(?:v2/mcp|mcp)/?$ {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      chunked_transfer_encoding off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Overwrite any client-supplied request id at the hosted edge. The app
      # also generates its own audit id, but this keeps ingress logs unspoofed.
      proxy_set_header X-Request-ID $request_id;
      rewrite ^ /v2/mcp break;
      proxy_pass http://app;
    }

    # Header-based with version: /v1|v2/{rest} (MUST COME BEFORE LEGACY)
    location ~ ^/v(?:1|2)/(.*)$ {
      proxy_buffering off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^/v(?:1|2)/(.*)$ /$1 break;
      proxy_pass http://app;
    }

    # Deprecated API-key-in-path MCP compatibility. These legacy remote client
    # URLs must still hit the hosted Streamable HTTP MCP endpoint while moving
    # the path key into the header consumed by the app. Keep this after the
    # header-based /v1|v2 route so /v1/mcp and /v2/mcp are not treated as API
    # keys, and before the generic legacy API-key rewrites below.
    location ~ ^/(?<apikey>[^/]+)/(?:v2/mcp|mcp)/?$ {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      chunked_transfer_encoding off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Connection "";
      proxy_set_header X-Firecrawl-API-Key $apikey;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Overwrite any client-supplied request id at the hosted edge. The app
      # also generates its own audit id, but this keeps ingress logs unspoofed.
      proxy_set_header X-Request-ID $request_id;
      rewrite ^ /v2/mcp break;
      proxy_pass http://app;
    }

    # Legacy with API key and version: /{apiKey}/v1|v2/{rest}
    location ~ ^/(?<apikey>[^/]+)/v(?:1|2)/(.*)$ {
      proxy_set_header X-Firecrawl-API-Key $apikey;
      proxy_set_header Host $host;

      proxy_buffering off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;

      rewrite ^/[^/]+/v(?:1|2)/(.*)$ /$1 break;
      proxy_pass http://app;
    }

    # Legacy: /{apiKey}/{rest}
    location ~ ^/(?<apikey>[^/]+)/(.*)$ {
      proxy_set_header X-Firecrawl-API-Key $apikey;
      proxy_set_header Host $host;

      proxy_buffering off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;

      rewrite ^/[^/]+/(.*)$ /$1 break;
      proxy_pass http://app;
    }

    # Direct header-based paths

    location /messages {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      chunked_transfer_encoding off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app/messages;
    }

    location /sse {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      chunked_transfer_encoding off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Connection "";
      proxy_set_header Accept "text/event-stream";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app/sse;
    }


    location /ready {
      proxy_buffering off;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app/ready;
    }

    location /health {
      proxy_buffering off;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app/health;
    }

    location / {
      return 301 https://docs.firecrawl.dev/mcp-server;
    }
  }
}

name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC authentication with MCP registry
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Authenticate
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A package.json change that does not bump the version, or a re-run after the npm step
      # succeeded, must not fail on "cannot publish over a previously published version".
      - name: Check whether npm already serves this version
        id: npm
        run: |
          if [ "$(npm view "firecrawl-mcp@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
            echo "firecrawl-mcp@${VERSION} is already on npm; skipping the npm publish"
            echo "on_npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_npm=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish to NPM
        if: steps.npm.outputs.on_npm != 'true'
        run: |
          pnpm install
          pnpm run build
          pnpm publish --access public --no-git-checks

      # npm takes a few minutes to serve a new version, and the MCP registry checks npm for the
      # version before it accepts a server.json; publishing to it straight after npm fails with
      # "version was not found (status: 404)". Wait until npm serves the version.
      - name: Wait until npm serves the version
        run: |
          for attempt in $(seq 1 40); do
            if [ "$(npm view "firecrawl-mcp@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
              echo "npm serves firecrawl-mcp@${VERSION}"
              exit 0
            fi
            echo "firecrawl-mcp@${VERSION} is not on npm yet (attempt ${attempt} of 40); waiting 15 s"
            sleep 15
          done
          echo "firecrawl-mcp@${VERSION} is still not on npm after 10 minutes" >&2
          exit 1
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      # Registry versions are immutable, so a version that is already registered is done.
      - name: Check whether the MCP registry already has this version
        id: registry
        run: |
          http_status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${SERVER_NAME}/versions/${VERSION}")
          if [ "${http_status}" = "200" ]; then
            echo "${SERVER_NAME} ${VERSION} is already in the MCP registry; skipping the registry publish"
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SERVER_NAME: io.github.firecrawl%2Ffirecrawl-mcp-server
          VERSION: ${{ steps.version.outputs.version }}

      - name: Sync MCP Registry version
        if: steps.registry.outputs.registered != 'true'
        run: |
          node -e "
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const manifest = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            manifest.version = packageJson.version;
            for (const pkg of manifest.packages ?? []) {
              if (pkg.registryType === 'npm' && pkg.identifier === 'firecrawl-mcp') {
                pkg.version = packageJson.version;
              }
            }
            fs.writeFileSync('server.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Publish to MCP Registry
        if: steps.registry.outputs.registered != 'true'
        run: |
          for attempt in 1 2 3; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "registry publish failed (attempt ${attempt} of 3); retrying in 30 s"
              sleep 30
            fi
          done
          exit 1

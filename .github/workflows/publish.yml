name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - server.json
      - pnpm-lock.yaml
      - src/**
      - .github/workflows/publish.yml
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC authentication with MCP registry
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.7.9
      MCP_PUBLISHER_CHECKSUM_FILE: registry_1.7.9_checksums.txt

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package gates
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run check:manifest
          pnpm test

      - name: Publish to NPM
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install verified MCP Publisher
        shell: bash
        run: |
          set -euo pipefail
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          asset="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/${MCP_PUBLISHER_CHECKSUM_FILE}"
          grep " ${asset}$" "${MCP_PUBLISHER_CHECKSUM_FILE}" | sha256sum -c -
          tar xzf "${asset}" mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

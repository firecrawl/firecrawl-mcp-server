name: Deploy Images to GHCR

env:
  DOTNET_VERSION: '6.0.x'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v1

      - name: 'Build Service Image'
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.service
          push: true
          tags: |
            ghcr.io/firecrawl/firecrawl-mcp-service:latest
            ghcr.io/firecrawl/firecrawl-mcp-service:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/firecrawl/firecrawl-mcp-service:latest
          cache-to: type=inline

      - name: 'Read Package Version'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 'Build Server Image'
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/firecrawl/firecrawl-mcp-server:latest
            ghcr.io/firecrawl/firecrawl-mcp-server:v${{ steps.version.outputs.version }}
            ghcr.io/firecrawl/firecrawl-mcp-server:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/firecrawl/firecrawl-mcp-server:latest
          cache-to: type=inline

      - name: 'Push Service Image Package'
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.service
          push: true
          tags: |
            ghcr.io/firecrawl/firecrawl-mcp-service:latest
            ghcr.io/firecrawl/firecrawl-mcp-service:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/firecrawl/firecrawl-mcp-server:latest
          cache-to: type=inline
